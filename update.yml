name: Update World Pulse data

on:
  schedule:
    - cron: "*/5 * * * *"      # каждые 5 минут (GitHub может запускать с задержкой)
  workflow_dispatch:            # ручной запуск кнопкой Run workflow

permissions:
  contents: write

concurrency:
  group: world-pulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector.py
      - name: Commit changes
        run: |
          git config user.name "world-pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json history.json translations.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || (git commit -m "data: update" && git pull --rebase -q && git push)
